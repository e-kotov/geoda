name: Apple Metal GPU Tests

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'metal**'
      - 'wip/**'
    paths:
      - 'Algorithms/**'
      - '.github/workflows/metal_ci.yml'
  pull_request:
    paths:
      - 'Algorithms/**'
      - '.github/workflows/metal_ci.yml'
  workflow_dispatch:

jobs:
  test_metal_gpu:
    name: Metal GPU Permutations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15] # macos-14 runners expose no Metal device

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Apple Silicon Environment
        run: |
          uname -a
          arch
          sw_vers

      - name: Build Standalone Metal Permutation Test
        run: |
          clang++ -std=c++14 -O2 -Wall -fobjc-arc Algorithms/test_metal_lisa.mm \
            -framework Metal -framework Foundation \
            -o Algorithms/test_metal_lisa

      - name: Run Metal Permutation Test on Apple Silicon GPU
        env:
          GEODA_METAL_ANY_GPU: 1 # GitHub runners have a paravirtual GPU
        run: |
          ./Algorithms/test_metal_lisa Algorithms/lisa_kernel.metal Algorithms/localjc_kernel.metal
